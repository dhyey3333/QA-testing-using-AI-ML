<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kulhad Pay (test mode)</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 18px; background: #fff; color: #222; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .test { display: inline-block; background: #fff4d6; color: #7a5200; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
    label { display: block; margin: 14px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    button { margin-top: 14px; padding: 9px 14px; font: inherit; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; }
    .hint { color: #666; font-size: 12px; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <!-- A stand-in for a payment gateway's checkout in test mode (Razorpay and others embed theirs in
       an iframe on their own origin). It accepts Razorpay's published test UPI IDs: success@razorpay
       pays, failure@razorpay is declined. No real payment of any kind happens here. -->
  <h1>Kulhad Pay <span class="test">TEST MODE</span></h1>
  <p>Amount: <strong id="amount"></strong></p>
  <form id="pay">
    <label>UPI ID <input name="vpa" autocomplete="off" placeholder="yourname@bank"></label>
    <p class="hint">Test mode: success@razorpay pays, failure@razorpay is declined.</p>
    <p class="error" id="error" role="alert"></p>
    <button type="submit">Pay now</button>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("amount").textContent = "₹" + (params.get("amount") || "0");
    document.getElementById("pay").onsubmit = (event) => {
      event.preventDefault();
      const vpa = event.target.vpa.value.trim().toLowerCase();
      const error = document.getElementById("error");
      if (!/^[\w.-]+@[\w.-]+$/.test(vpa)) {
        error.textContent = "Enter a valid UPI ID.";
        return;
      }
      const status = vpa === "success@razorpay" ? "paid" : "failed";
      // The parent page is told the result, the way gateway checkouts report back.
      window.parent.postMessage({ type: "kulhad-pay", status, ref: params.get("ref") }, "*");
      document.getElementById("pay").hidden = true;
      document.body.insertAdjacentHTML("beforeend", status === "paid" ? "<p>Payment successful.</p>" : "<p>Payment declined.</p>");
    };
  </script>
</body>
</html>
