<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visual lab | Kulhad &amp; Co.</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #2a1a10; background: #fdf8f3; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: #7a3b12; color: #fff; }
  header nav a { color: #fff; margin-left: 20px; text-decoration: none; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card { background: #fff; border: 1px solid #e8d8c8; border-radius: 10px; padding: 16px; }
  .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; background: #f0e3d6; display: block; }
  .card h3 { margin: 12px 0 4px; font-size: 18px; }
  .price { font-weight: 700; color: #7a3b12; font-size: 18px; }
  .card button { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #c2571a; color: #fff; font-size: 15px; }
  .banner { margin-bottom: 20px; padding: 14px 18px; border-radius: 8px; background: #fbe6c9; }
  footer { margin-top: 32px; color: #8a6a52; font-size: 14px; }
  /* The visual bugs, one per ?look= value. */
  body.overlap .grid { grid-template-columns: repeat(3, 1fr); }
  body.overlap .card:nth-child(2) { margin-left: -180px; margin-top: 40px; }
  body.invisible .price { color: #fff; }
  body.collapsed .grid { display: block; width: 180px; }
  body.collapsed .card { margin-bottom: -60px; }
  body.offscreen .card button { position: relative; left: 2000px; }
</style>
</head>
<body>
<header><strong>Kulhad &amp; Co.</strong><nav><a href="#">Shop</a><a href="#">Cart (0)</a><a href="#">Log in</a></nav></header>
<main>
  <div class="banner" id="banner">Festive offer: free delivery on orders over ₹499 until 15 October.</div>
  <div class="grid" id="grid"></div>
  <footer>Kulhad &amp; Co. · tea, coffee and things to drink them from</footer>
</main>
<script>
// One page, seven looks. "approved" is the baseline; "content" is a legitimate change (other
// products and offer); the rest are visual bugs a text check can't see.
const look = new URLSearchParams(location.search).get("look") || "approved";
document.body.className = look;
const pic = (hue) => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='150'><rect width='300' height='150' fill='hsl(${hue},55%,62%)'/>`
  + `<circle cx='150' cy='75' r='42' fill='hsl(${hue},45%,38%)'/></svg>`);
const products = look === "content"
  ? [["Kashmiri Kahwa (100 g)", "₹260", 40], ["Cold Brew Bottle", "₹349", 200], ["Brass Tumbler", "₹510", 50]]
  : [["Masala Chai (250 g)", "₹180", 20], ["Filter Coffee (200 g)", "₹240", 30], ["Clay Kulhad (set of 6)", "₹420", 15]];
if (look === "content") document.getElementById("banner").textContent = "New this week: cold brew, and 10% off brass tumblers.";
document.getElementById("grid").innerHTML = products.map(([name, price, hue], i) => `
  <div class="card">
    <img src="${look === "missing-image" && i === 1 ? "/lab/no-such-picture.jpg" : pic(hue)}" alt="${name}">
    <h3>${name}</h3><div class="price">${price}</div><button type="button">Add to cart</button>
  </div>`).join("");
</script>
</body>
</html>
