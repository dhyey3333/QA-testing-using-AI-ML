<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create an account</title></head>
<body>
  <h1>Create an account</h1>
  <!-- The shop's banner: its file is missing, so the server answers 404. -->
  <img src="/lab/missing-banner.png" alt="Our shop" width="240" height="80">
  <!-- A logo that loads fine, and must not be flagged. -->
  <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjNWI1YmQ2Ii8+PC9zdmc+" alt="Logo" width="40" height="40">
  <form>
    <!-- Correct fields, some with meaningless names: none of these may be flagged. -->
    <label for="name">Full name</label> <input id="name" name="field_7">
    <label for="email">Email address</label> <input id="email" name="user_email" type="email" placeholder="you@company.com">
    <label for="city">City</label> <input id="city" name="city" placeholder="e.g. Pune">
    <label for="zip">Postcode</label> <input id="zip" name="zipCode" autocomplete="postal-code">
    <!-- The bug: Country and State swapped. The ids follow the labels; the fields themselves don't. -->
    <label for="country">Country</label> <input id="country" name="state" placeholder="Your state">
    <label for="state">State</label> <select id="state" name="country"><option>Select your country</option><option>India</option></select>
    <button type="submit">Create account</button>
  </form>
  <p><a href="/lab/explore-long.html">Long form</a></p>
</body>
</html>
