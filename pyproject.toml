[project]
name = "nightshift"
version = "0.1.0"
description = "An AI QA tester: plain-English test specs, run by an agent in a real browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    # Each Playwright release expects one exact Chromium build; pinning it means
    # `playwright install` never has to re-download a browser behind your back.
    "playwright==1.62.0",
    "pyyaml>=6.0",
]

[project.scripts]
nightshift = "nightshift.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightshift", "demo_shop", "holdout", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
